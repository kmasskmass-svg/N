<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلتي في الإنجليزي</title>
<meta name="description" content="رحلة تفاعلية كاملة لمذاكرة الإنجليزي - ثاني متوسط - الفصل الأول: خريطة وحدات، مفردات، قواعد، اختبارات، تحدي يومي وبطاقات تعليمية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Almarai:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6FD; --surface:#FFFFFF; --surface-2:#F1EEFB; --surface-3:#E6E0F7;
    --ink:#211A3A; --ink-soft:#5C5480; --ink-faint:#948CB5;
    --primary:#5B3DF0; --primary-strong:#4527D6; --primary-soft:#EAE4FF;
    --accent:#FF7A45; --accent-strong:#E85A22; --accent-soft:#FFE7DA;
    --gold:#F5A623; --gold-soft:#FFF1D8;
    --success:#16A34A; --success-soft:#DCFCE7;
    --error:#E11D48; --error-soft:#FFE1E8;
    --border:#E6E1F5; --shadow:0 1px 2px rgba(60,40,150,.05), 0 16px 36px -18px rgba(60,40,150,.30);
    --radius:22px; --radius-sm:14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15101F; --surface:#1F1832; --surface-2:#271F3F; --surface-3:#32294F;
      --ink:#F2EEFB; --ink-soft:#C7BEE2; --ink-faint:#8F84B3;
      --primary:#9484FF; --primary-strong:#B0A3FF; --primary-soft:#342A5C;
      --accent:#FF9868; --accent-strong:#FFB08C; --accent-soft:#4A2E1E;
      --gold:#FDC759; --gold-soft:#493919;
      --success:#4ADE80; --success-soft:#153B26;
      --error:#FF6E8A; --error-soft:#451826;
      --border:#392E58; --shadow:0 1px 2px rgba(0,0,0,.25), 0 16px 36px -18px rgba(0,0,0,.65);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15101F; --surface:#1F1832; --surface-2:#271F3F; --surface-3:#32294F;
    --ink:#F2EEFB; --ink-soft:#C7BEE2; --ink-faint:#8F84B3;
    --primary:#9484FF; --primary-strong:#B0A3FF; --primary-soft:#342A5C;
    --accent:#FF9868; --accent-strong:#FFB08C; --accent-soft:#4A2E1E;
    --gold:#FDC759; --gold-soft:#493919;
    --success:#4ADE80; --success-soft:#153B26;
    --error:#FF6E8A; --error-soft:#451826;
    --border:#392E58; --shadow:0 1px 2px rgba(0,0,0,.25), 0 16px 36px -18px rgba(0,0,0,.65);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(680px 420px at 12% -6%, color-mix(in srgb, var(--primary) 10%, transparent), transparent 60%),
      radial-gradient(620px 380px at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink); font-family:"Almarai","Tahoma",sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:"Baloo Bhaijaan 2","Almarai",sans-serif; font-weight:700; margin:0;}
  .en{font-family:"Space Mono",monospace; direction:ltr; unicode-bidi:isolate;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--primary-soft);}

  /* ---------- Topbar ---------- */
  #topbar{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px;
    padding:10px 18px; background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(10px); border-bottom:2px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px; flex:0 1 auto; min-width:0;}
  .brand-badge{
    width:40px; height:40px; border-radius:14px; background:linear-gradient(155deg,var(--primary),var(--accent));
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; box-shadow:var(--shadow); flex:none;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0; overflow:hidden;}
  .brand-text b{font-size:1.05rem; font-family:"Baloo Bhaijaan 2"; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand-text span{font-size:.68rem; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #topnav{display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; padding:2px 0;}
  #topnav::-webkit-scrollbar{display:none;}
  .nav-chip{
    flex:none; padding:9px 15px; border-radius:999px; border:2px solid transparent; background:none;
    color:var(--ink-soft); font-weight:700; font-size:.85rem; white-space:nowrap; transition:.15s;
  }
  .nav-chip:hover{background:var(--surface-2);}
  .nav-chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-strong)); color:#fff; box-shadow:var(--shadow);}
  .top-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .icon-btn{
    width:40px; height:40px; border-radius:12px; border:2px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:1.05rem; display:flex; align-items:center; justify-content:center; flex:none;
    transition:border-color .15s, transform .15s;
  }
  .icon-btn:hover{border-color:var(--primary); transform:translateY(-2px);}
  #menuToggle{display:none;}

  /* ---------- Layout ---------- */
  .content-wrap{max-width:1080px; margin:0 auto; padding:26px 20px 90px;}
  .card{
    background:var(--surface); border:2px solid var(--border); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow); transition:transform .2s ease, box-shadow .2s ease;
  }
  .stack{display:flex; flex-direction:column; gap:16px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px;
    background:var(--surface-2); color:var(--ink-soft); font-size:.78rem; font-weight:700; border:2px solid var(--border);
  }
  .chip.gold{background:var(--gold-soft); color:var(--gold); border-color:transparent;}
  .btn{
    border:none; border-radius:16px; padding:12px 22px; font-weight:800; font-size:.92rem;
    background:linear-gradient(135deg,var(--primary),var(--primary-strong)); color:#fff; box-shadow:var(--shadow);
    display:inline-flex; align-items:center; gap:8px; transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .btn.secondary{background:var(--surface); color:var(--primary-strong); border:2px solid var(--primary-soft); box-shadow:none;}
  .btn.ghost{background:none; color:var(--ink-soft); border:2px solid var(--border); box-shadow:none;}
  .btn.accent{background:linear-gradient(135deg,var(--accent),var(--accent-strong)); box-shadow:var(--shadow);}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn:hover:not(:disabled){transform:translateY(-2px); filter:brightness(1.05);}
  .btn:active:not(:disabled){transform:scale(.96);}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px;
  }

  /* ---------- Achievement badges ---------- */
  .badges-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px;}
  .badge{
    display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:16px; border:2px solid var(--border);
    background:var(--surface); box-shadow:var(--shadow); opacity:.4; filter:grayscale(1);
  }
  .badge.earned{opacity:1; filter:none; border-color:var(--gold);}
  .badge .b-ic{font-size:1.3rem;}
  .badge .b-text{display:flex; flex-direction:column; line-height:1.25;}
  .badge .b-text b{font-size:.78rem;}
  .badge .b-text span{font-size:.66rem; color:var(--ink-faint);}

  /* ---------- Search Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,10,5,0.55); z-index:80;
    display:flex; align-items:flex-start; justify-content:center; padding:8vh 16px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-box{
    width:100%; max-width:640px; background:var(--surface); border-radius:var(--radius);
    border:2px solid var(--border); box-shadow:0 30px 60px -20px rgba(0,0,0,0.5); max-height:78vh; overflow:auto;
  }
  .modal-head{padding:18px 20px; border-bottom:2px solid var(--border); display:flex; gap:10px; align-items:center;}
  .modal-head input{
    flex:1; border:none; background:none; font-size:1.05rem; color:var(--ink); outline:none; font-family:inherit;
  }
  .modal-body{padding:14px 20px 22px;}
  .unit-pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:6px;}
  .unit-pick{
    border:2px solid var(--border); border-radius:14px; padding:10px 12px; background:var(--surface-2);
    text-align:start; display:flex; flex-direction:column; gap:2px;
  }
  .unit-pick:hover{border-color:var(--primary);}
  .unit-pick b{font-size:.85rem;}
  .unit-pick span{font-size:.7rem; color:var(--ink-faint);}
  .search-result{
    display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:12px;
  }
  .search-result:hover{background:var(--surface-2);}

  /* ---------- Home hero + journey ---------- */
  .hero{
    background:linear-gradient(160deg, var(--primary-soft), var(--surface) 70%); border:2px solid var(--border);
    border-radius:28px; padding:32px; position:relative; overflow:hidden; margin-bottom:26px;
  }
  .hero-eyebrow{font-size:.78rem; font-weight:800; color:var(--primary-strong); letter-spacing:.06em;}
  .hero h1{font-size:clamp(1.5rem, 4.2vw + 0.8rem, 2.1rem); margin:8px 0 10px; line-height:1.3;}
  .hero p{color:var(--ink-soft); max-width:640px; line-height:1.9; margin:0 0 18px;}
  .hero-actions{display:flex; flex-wrap:wrap; gap:10px;}
  .streak-badge{
    position:absolute; top:24px; inset-inline-end:28px; background:var(--surface); border:2px solid var(--gold);
    border-radius:16px; padding:10px 16px; text-align:center; box-shadow:var(--shadow);
  }
  .streak-badge b{font-size:1.4rem; color:var(--gold); display:block;}
  .streak-badge span{font-size:.68rem; color:var(--ink-faint);}

  .stats-row{display:grid; grid-template-columns:auto repeat(3,1fr); gap:14px; margin-bottom:28px; align-items:stretch;}
  .ring-card{
    background:var(--surface); border:2px solid var(--border); border-radius:var(--radius); padding:16px 22px;
    display:flex; align-items:center; gap:16px; box-shadow:var(--shadow);
  }
  .ring-wrap{position:relative; width:84px; height:84px; flex:none;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;}
  .ring-label b{font-size:1.05rem;}
  .ring-label span{font-size:.6rem; color:var(--ink-faint);}
  .stat-tile{
    background:var(--surface); border:2px solid var(--border); border-radius:var(--radius); padding:16px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden;
  }
  .stat-tile::before{
    content:''; position:absolute; inset-inline-start:0; top:0; height:4px; width:100%;
    background:linear-gradient(90deg,var(--primary),var(--accent));
  }
  .stat-tile:hover{transform:translateY(-3px);}
  .stat-tile b{font-size:1.5rem; font-family:"Space Mono",monospace; background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .stat-tile span{font-size:.72rem; color:var(--ink-faint); margin-top:4px;}

  .tools-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:34px;}
  .tool-tile{
    background:var(--surface); border:2px solid var(--border); border-radius:18px; padding:16px;
    display:flex; flex-direction:column; gap:6px; text-align:start; box-shadow:var(--shadow);
    transition:transform .15s, border-color .15s; text-decoration:none;
  }
  .tool-tile:hover{border-color:var(--accent); transform:translateY(-3px);}
  .tool-tile .ic{
    font-size:1.15rem; width:38px; height:38px; border-radius:12px; background:var(--primary-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .tool-tile b{font-size:.86rem;}
  .tool-tile span{font-size:.7rem; color:var(--ink-faint);}

  .journey-title{margin:0 0 22px; font-size:1.3rem; text-align:center;}
  .journey{position:relative; padding:10px 0 30px; max-width:720px; margin:0 auto;}
  .journey::before{
    content:""; position:absolute; top:0; bottom:0; inset-inline-start:50%; width:4px; margin-inline-start:-2px;
    border-radius:4px;
    background:linear-gradient(to bottom, var(--primary-soft), var(--border) 12%, var(--border) 88%, var(--primary-soft));
  }
  .j-row{position:relative; display:flex; margin-bottom:26px;}
  .j-row.left{justify-content:flex-start;}
  .j-row.right{justify-content:flex-end;}
  .j-card{
    width:calc(50% - 34px); background:var(--surface); border:2px solid var(--border); border-radius:18px;
    padding:14px 16px; box-shadow:var(--shadow); position:relative; text-align:start; transition:transform .15s, border-color .15s;
  }
  .j-card:hover{transform:translateY(-3px); border-color:var(--primary);}
  .j-node{
    position:absolute; top:8px; inset-inline-start:50%; margin-inline-start:-26px; width:52px; height:52px;
    border-radius:50%; background:var(--surface); border:4px solid var(--border); display:flex; align-items:center;
    justify-content:center; font-size:1.3rem; z-index:2; box-shadow:var(--shadow);
  }
  .j-node.done{border-color:var(--success);}
  .j-node.mid{border-color:var(--gold);}
  .j-row .j-num{position:absolute; top:16px; inset-inline-start:0; font-family:"Space Mono"; font-size:.7rem; color:var(--ink-faint);}
  .j-card b.jt{display:block; font-size:.95rem; margin-bottom:2px;}
  .j-card .jt-en{font-size:.72rem; color:var(--ink-faint); display:block; margin-bottom:8px;}
  .j-score{font-size:.7rem; font-weight:700; color:var(--success);}
  .j-expansion{
    margin:8px auto 26px; max-width:360px; text-align:center; background:var(--accent-soft); border:2px dashed var(--accent);
    border-radius:16px; padding:12px; font-size:.82rem; color:var(--accent-strong); font-weight:700;
  }
  .j-finish{
    margin:10px auto 0; max-width:420px; text-align:center; background:linear-gradient(155deg,var(--gold-soft),var(--surface));
    border:2px solid var(--gold); border-radius:20px; padding:20px;
  }

  /* ---------- Unit page ---------- */
  .unit-head{
    background:var(--surface); border:2px solid var(--border); border-radius:24px; padding:24px; margin-bottom:18px;
  }
  .unit-head .eyebrow{font-size:.75rem; color:var(--ink-faint); font-weight:700;}
  .unit-head h1{font-size:clamp(1.25rem, 3vw + 0.7rem, 1.7rem); margin:6px 0 4px; display:flex; align-items:center; gap:10px; line-height:1.3;}
  .unit-head .en-title{color:var(--ink-soft); font-size:1rem; margin-bottom:12px; display:block;}
  .func-chips{display:flex; flex-wrap:wrap; gap:7px;}

  .rail{
    position:sticky; top:66px; z-index:20; display:flex; gap:6px; overflow-x:auto; padding:10px 4px;
    background:var(--bg); margin-bottom:6px; scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none;}
  .rail-chip{
    flex:none; padding:8px 14px; border-radius:999px; border:2px solid var(--border); background:var(--surface);
    font-size:.8rem; font-weight:700; color:var(--ink-soft);
  }
  .rail-chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  .station{
    background:var(--surface); border:2px solid var(--border); border-radius:24px; padding:24px;
    padding-inline-start:29px; margin-bottom:20px; scroll-margin-top:120px; position:relative; overflow:hidden;
  }
  .station::before{
    content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px;
    background:linear-gradient(180deg,var(--primary),var(--gold)); opacity:.9;
  }
  .station-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .station-num{
    width:36px; height:36px; border-radius:12px; background:var(--primary); color:#fff; font-family:"Space Mono";
    display:flex; align-items:center; justify-content:center; font-weight:700; flex:none;
    box-shadow:0 6px 14px -6px color-mix(in srgb, var(--primary) 70%, transparent);
  }
  .station-head h2{font-size:1.15rem;}
  @media (prefers-reduced-motion: no-preference){
    .station{animation:sg2FadeUp .5s ease-out backwards;}
    .station:nth-of-type(1){animation-delay:.02s;} .station:nth-of-type(2){animation-delay:.05s;}
    .station:nth-of-type(3){animation-delay:.08s;} .station:nth-of-type(4){animation-delay:.11s;}
    .station:nth-of-type(5){animation-delay:.14s;} .station:nth-of-type(6){animation-delay:.17s;}
    .station:nth-of-type(7){animation-delay:.20s;} .station:nth-of-type(8){animation-delay:.23s;}
    @keyframes sg2FadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  }

  .hook-box{
    background:var(--accent-soft); border:2px solid var(--accent); border-radius:16px; padding:16px 18px; line-height:1.9; color:var(--ink);
  }

  .vocab-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .vocab-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2);
    border:2px solid var(--border); border-radius:14px; padding:10px 12px; position:relative;
    border-inline-start:5px solid var(--cat-color, var(--border));
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .vocab-item:hover{transform:translateY(-2px); box-shadow:0 10px 20px -12px rgba(0,0,0,.25);}
  .vocab-item[data-cat="nouns"]{--cat-color:#3B6FE0;}
  .vocab-item[data-cat="verbs"]{--cat-color:#FF7A45;}
  .vocab-item[data-cat="adjectives"]{--cat-color:#F5A623;}
  .vocab-item[data-cat="adverbs"]{--cat-color:#14B8A6;}
  .vocab-item[data-cat="expressions"]{--cat-color:#EC4899;}
  .vocab-item .vw{font-weight:700; font-family:"Space Mono"; direction:ltr; text-align:left;}
  .vocab-item .va{color:var(--ink-soft); font-size:.85rem; flex:1; text-align:end;}
  .vocab-item .wtag{font-size:.62rem; color:var(--ink-faint); margin-inline-start:4px;}
  .cat-pill{
    font-size:.6rem; font-weight:800; color:#fff; background:var(--cat-color,var(--ink-faint));
    border-radius:999px; padding:2px 7px; flex:none; white-space:nowrap;
  }
  .star-btn{background:none; border:none; font-size:1.1rem; color:var(--ink-faint); flex:none;}
  .star-btn.on{color:var(--gold);}
  .vocab-item .item-actions{display:flex; align-items:center; gap:6px; flex:none;}
  .vocab-group h3{font-size:.95rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .vocab-group{margin-bottom:16px;}
  .vocab-group h3 .qtag{font-size:.65rem; background:var(--surface-3); padding:3px 9px; border-radius:999px; color:var(--ink-soft); font-weight:700;}

  .g-card{border:2px solid var(--border); border-radius:18px; padding:16px 18px; background:var(--surface-2); margin-bottom:14px;}
  .g-card h3{font-size:1rem; margin-bottom:4px;}
  .g-card .en-sub{font-size:.78rem; color:var(--ink-faint); display:block; margin-bottom:10px;}
  .g-card p{line-height:1.9; color:var(--ink-soft); margin:0 0 10px;}
  .ex-row{display:flex; flex-direction:column; gap:2px; padding:8px 12px; background:var(--surface); border-radius:10px; margin-bottom:6px; border-inline-start:4px solid var(--primary);}
  .ex-row .en{font-weight:600;}
  .ex-row .ar{color:var(--ink-faint); font-size:.82rem;}
  .callout{border-radius:16px; padding:14px 16px; margin-top:14px; line-height:1.85;}
  .callout.mistake{background:var(--surface-2); border:2px solid var(--error);}
  .callout.tip{background:var(--gold-soft); border:2px solid var(--gold);}
  .callout b{display:block; margin-bottom:6px;}
  .callout .wrong-box, .callout .right-box{
    display:flex; align-items:center; gap:8px; border-radius:10px; padding:8px 12px; margin-bottom:6px;
    font-family:"Space Mono"; font-weight:700;
  }
  .callout .wrong-box{background:var(--error-soft); color:var(--error);}
  .callout .right-box{background:var(--success-soft); color:var(--success);}
  .callout .wrong-box .en{text-decoration:line-through;}
  .callout .wrong{color:var(--error); text-decoration:line-through; font-family:"Space Mono";}
  .callout .right{color:var(--success); font-family:"Space Mono"; font-weight:700;}

  /* ---------- Quiz ---------- */
  .qsection{margin-bottom:22px;}
  .qsection h3{font-size:1rem; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .qsection .qtag{font-size:.62rem; background:var(--surface-3); padding:3px 9px; border-radius:999px; color:var(--ink-soft); font-family:"Space Mono"; font-weight:700;}
  .qitem{background:var(--surface-2); border:2px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:10px;}
  .qtext{font-weight:700; margin-bottom:10px; line-height:1.7;}
  .opts{display:flex; flex-direction:column; gap:8px;}

  .opt-btn.correct{border-color:var(--success); background:var(--success-soft);}
  .opt-btn.wrong{border-color:var(--error); background:var(--error-soft);}

    color:var(--ink); font-size:.95rem; font-family:"Space Mono";
  }
  .feedback{margin-top:8px; font-size:.82rem; font-weight:700;}
  .feedback.ok{color:var(--success);}
  .feedback.bad{color:var(--error);}
  .match-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .match-row .vw{flex:1; font-family:"Space Mono"; font-weight:700; direction:ltr; text-align:left;}

  .flashcard .fc-hint{position:absolute; bottom:12px; font-size:.7rem; color:var(--ink-faint);}
  .flashcard .fc-known-tag{position:absolute; top:10px; inset-inline-end:12px; font-size:.66rem; background:var(--success-soft); color:var(--success); padding:2px 8px; border-radius:999px; font-weight:700;}
  .fc-controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .fc-know-row{display:flex; gap:10px;}
  .fc-toolbar{width:100%; display:flex; justify-content:center;}
  .fc-filter{font-size:.78rem; color:var(--ink-soft); display:flex; gap:6px; align-items:center;}

  .self-row{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:14px; border:2px solid var(--border); background:var(--surface-2);}
  .self-row.done{border-color:var(--success); background:var(--success-soft);}
  .self-row input{margin-top:3px;}
  .self-list{display:flex; flex-direction:column; gap:8px;}

  /* ---------- Weak words / glossary ---------- */
  .weak-row{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:2px solid var(--border); border-radius:14px; padding:10px 14px;}

  .glossary-controls input{flex:2 1 180px;}
  .glossary-controls select{flex:1 1 140px;}

  .irr-table{width:100%; border-collapse:separate; border-spacing:0 8px;}

  .table-wrap{overflow-x:auto;}

  .page-header{margin-bottom:20px;}

  /* ---------- Toast / Confetti ---------- */
  #toast{
    position:fixed; bottom:24px; inset-inline-start:50%; transform:translateX(-50%); z-index:200;

    opacity:0; pointer-events:none; transition:.25s; box-shadow:var(--shadow);
  }
  [dir="rtl"] #toast{transform:translateX(50%);}
  #toast.show{opacity:1;}
  #confettiRoot{position:fixed; inset:0; pointer-events:none; z-index:300; overflow:hidden;}
  .confetti-piece{position:absolute; top:-20px; width:9px; height:14px; border-radius:2px; opacity:.9;}

  @media print{

    .j-expansion{max-width:none; font-size:.78rem; padding:10px;}

    .unit-head{padding:18px 16px; border-radius:18px;}
    .rail{top:52px; gap:5px; padding:8px 2px;}
    .rail-chip{padding:7px 12px; font-size:.75rem;}
    .station{padding:18px 16px; border-radius:18px; scroll-margin-top:150px;}

    .quiz-meta{top:100px; padding:9px 12px; font-size:.75rem;}
    .vocab-grid{grid-template-columns:1fr;}
    .match-row{flex-wrap:wrap;}
    .match-row .vw{flex:1 1 100%;}
    .match-row select{flex:1 1 100%;}

    .modal-overlay{padding:0; align-items:stretch;}
    .modal-box{max-width:100%; max-height:100vh; height:100vh; border-radius:0; border:none;}
    .unit-pick-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}

    .flashcard{height:200px; padding:18px;}
    .fc-controls .btn, .fc-know-row .btn{flex:1 1 auto; justify-content:center; padding:11px 10px; font-size:.82rem;}
  }

  /* ---------- Small phones (400px and below): extra compaction ---------- */
  @media (max-width:400px){
    .brand-text span{display:none;}
    .stats-row{grid-template-columns:repeat(3,1fr); gap:6px;}
    .stat-tile{padding:10px 4px;}
    .stat-tile b{font-size:.98rem;}
    .stat-tile span{font-size:.58rem;}
    .tools-row{grid-template-columns:1fr 1fr;}
    .hero h1{font-size:1.35rem;}
    .hero p{font-size:.85rem; line-height:1.75;}

  }

  /* ---------- Large desktop: keep content comfortably centered ---------- */
  @media (min-width:1500px){
    .content-wrap{max-width:1180px;}
  }
</style>

/* ======================= STORAGE ======================= */
const LS_PROGRESS="sg2v2_progress", LS_THEME="sg2v2_theme", LS_WEAK="sg2v2_weak", LS_KNOWN="sg2v2_known",
      LS_SELF="sg2v2_self", LS_STREAK="sg2v2_streak", LS_DAILY="sg2v2_daily", LS_LASTROUTE="sg2v2_lastroute";
function loadJSON(key,fallback){ try{ const v=JSON.parse(localStorage.getItem(key)); return v==null?fallback:v; }catch(e){ return fallback; } }
function saveJSON(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let progress = loadJSON(LS_PROGRESS, {});
function saveProgress(){ saveJSON(LS_PROGRESS, progress); }

let weakWords = loadJSON(LS_WEAK, {});
function saveWeak(){ saveJSON(LS_WEAK, weakWords); }
function markWeak(en, ar, unitNumber){ if(!en) return; weakWords[en] = {en, ar, unit:unitNumber}; saveWeak(); }
function unmarkWeak(en){ if(!en) return; delete weakWords[en]; saveWeak(); }
function toggleWeak(btn, en, ar, unitNumber){
  if(weakWords[en]){ unmarkWeak(en); btn.classList.remove('on'); btn.textContent='☆'; }
  else { markWeak(en, ar, unitNumber); btn.classList.add('on'); btn.textContent='★'; }
}

let known = loadJSON(LS_KNOWN, {});
function saveKnown(){ saveJSON(LS_KNOWN, known); }
function isKnown(ckey){ return !!known[ckey]; }

let selfCheck = loadJSON(LS_SELF, {});
function saveSelf(){ saveJSON(LS_SELF, selfCheck); }

/* ======================= THEME ======================= */
function applyTheme(){ try{ const t=localStorage.getItem(LS_THEME); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){} }
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const effectiveDark = cur ? cur==='dark' : sysDark;
  const next = effectiveDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(LS_THEME, next); }catch(e){}
}
applyTheme();

/* ======================= HELPERS ======================= */
function esc(s){ return (s+"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalize(s){ return (s||'').toString().trim().toLowerCase().replace(/[.!?،؛,]/g,'').replace(/\s+/g,' '); }
function allVocabEntries(u){
  const v=u.vocab; let out=[];
  ["nouns","verbs","adjectives","adverbs","expressions"].forEach(k=>{ (v[k]||[]).forEach(pair=> out.push({en:pair[0], ar:pair[1], cat:k})); });
  return out;
}
function seededRand(seedStr){
  let h=0; for(let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) >>> 0; }
  return function(){ h = (h*1664525 + 1013904223) >>> 0; return h / 4294967296; };
}
function seededShuffle(arr, rnd){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), 2200);
}
function fireConfetti(n){
  n = n || 90;
  const root = document.getElementById('confettiRoot');
  const colors = ['#E85D3D','#2456C9','#E8A33D','#1E9E64','#D6304A'];
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.transform = 'rotate('+Math.floor(Math.random()*360)+'deg)';
    const dur = 1.8 + Math.random()*1.4;
    const drift = (Math.random()*140-70);
    el.animate([
      {transform: el.style.transform+' translateY(0)', opacity:1},
      {transform: 'rotate('+(Math.random()*720)+'deg) translateY(100vh) translateX('+drift+'px)', opacity:0.3}
    ], {duration: dur*1000, easing:'cubic-bezier(.3,.6,.7,1)'});
    root.appendChild(el);
    setTimeout(()=> el.remove(), dur*1000+50);
  }
}

/* ======================= ROUTER ======================= */
function parseHash(){
  const h = (location.hash||'#/').slice(1);
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {view:'home'};
  if(parts[0]==='unit') return {view:'unit', id:parseInt(parts[1]), scrollTo:parts[2]};
  if(parts[0]==='expansion') return {view:'expansion', id:parts[1]};
  if(parts[0]==='irregular') return {view:'irregular'};
  if(parts[0]==='final') return {view:'final'};
  if(parts[0]==='weak') return {view:'weak'};
  if(parts[0]==='weakcards') return {view:'weakcards'};
  if(parts[0]==='glossary') return {view:'glossary'};
  if(parts[0]==='daily') return {view:'daily'};
  return {view:'home'};
}
function goTo(hash){ closeSearchModal(); location.hash = hash; }

function openSearchModal(){
  document.getElementById('navModalOverlay').hidden = false;
  document.getElementById('navSearchInput').value = '';
  paintNavModal('');
  setTimeout(()=> document.getElementById('navSearchInput').focus(), 30);
}
function openNavModal(){ openSearchModal(); }
function closeSearchModal(){ document.getElementById('navModalOverlay').hidden = true; }
function onNavSearch(){ paintNavModal(document.getElementById('navSearchInput').value); }
function paintNavModal(q){
  const body = document.getElementById('navModalBody');
  q = (q||'').trim();
  if(q.length < 2){
    let html = '<p style="font-size:.75rem; color:var(--ink-faint); margin:4px 0 10px;">اختصارات سريعة</p>';
    html += '<div class="chips" style="margin-bottom:16px;">'+
      '<button class="chip" onclick="goTo(\'/daily\')">🔥 تحدي اليوم</button>'+
      '<button class="chip" onclick="goTo(\'/glossary\')">📖 القاموس الشامل</button>'+
      '<button class="chip" onclick="goTo(\'/weak\')">⭐ كلماتي الصعبة</button>'+
      '<button class="chip" onclick="goTo(\'/irregular\')">🔤 الأفعال الشاذة</button>'+
      '<button class="chip" onclick="goTo(\'/final\')">🏁 اختبار شامل</button>'+
    '</div>';
    html += '<p style="font-size:.75rem; color:var(--ink-faint); margin:4px 0 10px;">اذهب مباشرة لوحدة</p>';
    html += '<div class="unit-pick-grid">'+ UNITS.map(u=>
      `<button class="unit-pick" onclick="goTo('/unit/${u.id}')"><b>${UNIT_ICONS[u.number]||'📘'} U${u.number}</b><span>${esc(u.titleAr)}</span></button>`
    ).join('') + '</div>';
    body.innerHTML = html;
    return;
  }
  const nq = normalize(q);
  let results = [];
  UNITS.forEach(u=>{
    allVocabEntries(u).forEach(e=>{
      if(normalize(e.en).includes(nq) || e.ar.includes(q)) results.push({...e, unit:u.number, unitId:u.id});
    });
  });
  results = results.slice(0,40);
  if(results.length===0){ body.innerHTML = '<p style="color:var(--ink-faint); padding:20px 0;">لا نتائج مطابقة.</p>'; return; }
  body.innerHTML = results.map(r=>
    `<div class="search-result"><div><span class="vw en" style="font-weight:700;">${esc(r.en)}</span> — <span class="va">${esc(r.ar)}</span></div>
     <button class="btn secondary" style="padding:6px 12px; font-size:.75rem;" onclick="goTo('/unit/${r.unitId}/vocab')">وحدة ${r.unit}</button></div>`
  ).join('');
}

/* ======================= HOME ======================= */
function unitScorePct(u){
  const p = progress['u'+u.id];
  if(!p || !p.total) return null;
  return p.score / p.total;
}
function overallMasteryPct(){
  let sum=0;
  UNITS.forEach(u=>{ const pct = unitScorePct(u); sum += pct==null?0:pct; });
  return Math.round((sum/UNITS.length)*100);
}
function findContinueUnit(){
  for(const u of UNITS){ if(!progress['u'+u.id]) return u; }
  let worst=UNITS[0], worstPct=1;
  UNITS.forEach(u=>{ const pct=unitScorePct(u); if(pct!=null && pct<worstPct){ worstPct=pct; worst=u; } });
  return worst;
}
function ringSvg(pct, size, stroke, color){
  size = size||84; stroke = stroke||9;
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color||'var(--primary)'}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}
function computeBadges(){
  const attempted = UNITS.filter(u=>progress['u'+u.id]).length;
  const perfectUnits = UNITS.filter(u=>{ const p=progress['u'+u.id]; return p && p.total>0 && p.score===p.total; }).length;
  const strongUnits = UNITS.filter(u=>{ const pct=unitScorePct(u); return pct!=null && pct>=0.9; }).length;
  const streak = loadJSON(LS_STREAK, {count:0});
  const knownCount = Object.keys(known).length;
  return [
    {icon:'🎯', title:'أول خطوة', sub:'أنجزت أول اختبار وحدة', earned:attempted>=1},
    {icon:'🚀', title:'نص الطريق', sub:'بدأت 8 وحدات أو أكثر', earned:attempted>=8},
    {icon:'🏆', title:'قاهر الفصل', sub:'بدأت الوحدات الـ16 كاملة', earned:attempted>=16},
    {icon:'💯', title:'نتيجة كاملة', sub:'حصلت على العلامة الكاملة في وحدة', earned:perfectUnits>=1},
    {icon:'🧠', title:'خبير القواعد', sub:'إتقان 90%+ في 5 وحدات', earned:strongUnits>=5},
    {icon:'🔥', title:'ملتزم', sub:'3 أيام متتالية بتحدي اليوم', earned:(streak.count||0)>=3},
    {icon:'📗', title:'مستكشف الكلمات', sub:'أتقنت 30 بطاقة تعليمية', earned:knownCount>=30},
  ];
}
function renderBadgesRow(){
  const badges = computeBadges();
  const earnedCount = badges.filter(b=>b.earned).length;
  return `<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;">
      <h2 style="font-size:1.1rem;">🏅 إنجازاتك</h2>
      <span style="font-size:.78rem; color:var(--ink-faint);"><span class="en">${earnedCount} / ${badges.length}</span> شارة</span>
    </div>
    <div class="badges-row">${badges.map(b=>`
      <div class="badge ${b.earned?'earned':''}" title="${b.earned?'':'لم تُفتح بعد'}">
        <span class="b-ic">${b.icon}</span>
        <span class="b-text"><b>${b.title}</b><span>${b.sub}</span></span>
      </div>`).join('')}
    </div>`;
}

  html += `</div>`;

  document.getElementById('content').innerHTML = html;

  {key:'grammar', label:'القواعد', icon:'📘'},
  {key:'quiz', label:'التمارين', icon:'📝'},
  {key:'cards', label:'البطاقات', icon:'🃏'},
  {key:'self', label:'قيّم نفسك', icon:'✅'}
];
let unitObserver = null;
function renderUnit(route){
  const u = UNITS.find(x=>x.id===route.id);
  if(!u){ goTo('/'); return; }
  const extra = UNIT_EXTRAS[u.number] || {hook:'',mistakes:[],tip:''};

  const uIdx = UNITS.findIndex(x=>x.id===u.id);
  const prevU = UNITS[uIdx-1], nextU = UNITS[uIdx+1];
  let html = `<div class="unit-head">
    <p class="eyebrow">UNIT ${u.number} &middot; صفحات الكتاب <span class="en">p.${u.pages}</span></p>
    <h1>${UNIT_ICONS[u.number]||'📘'} ${esc(u.titleAr)}</h1>
    <span class="en-title en">${esc(u.titleEn)}</span>
    <div class="func-chips">${u.functionsAr.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;">
      ${prevU? `<button class="btn ghost" onclick="goTo('/unit/${prevU.id}')">◀ ${esc(prevU.titleAr)}</button>` : ''}
      ${nextU? `<button class="btn secondary" onclick="goTo('/unit/${nextU.id}')">${esc(nextU.titleAr)} ▶</button>` : ''}
      <button class="btn ghost" onclick="window.print()">🖨️ اطبع هذه الوحدة</button>
    </div>
  </div>`;

  html += `<div class="rail" id="unitRail">`+ STATIONS.map(s=>`<button class="rail-chip" data-target="station-${s.key}" onclick="scrollToStation('${s.key}')">${s.icon} ${s.label}</button>`).join('') +`</div>`;

  html += `<section class="station" id="station-hook">
    <div class="station-head"><span class="station-num">1</span><h2>✨ تمهيد الوحدة</h2></div>
    <div class="hook-box">${esc(extra.hook)}</div>
  </section>`;

  html += `<section class="station" id="station-vocab">
    <div class="station-head"><span class="station-num">2</span><h2>📗 المفردات</h2></div>
    ${renderVocabStation(u)}
  </section>`;

  html += `<section class="station" id="station-grammar">
    <div class="station-head"><span class="station-num">3</span><h2>📘 القواعد</h2></div>
    ${renderGrammarStation(u, extra)}
  </section>`;

  html += `<section class="station" id="station-quiz">
    <div class="station-head"><span class="station-num">4</span><h2>📝 التمارين</h2></div>
    ${renderQuizStation(u)}
  </section>`;

  html += `<section class="station" id="station-cards">
    <div class="station-head"><span class="station-num">5</span><h2>🃏 البطاقات التعليمية</h2></div>
    ${fcMarkupFor(u)}
  </section>`;

  html += `<section class="station" id="station-self">
    <div class="station-head"><span class="station-num">6</span><h2>✅ قيّم نفسك</h2></div>
    ${renderSelfStation(u)}
  </section>`;

  document.getElementById('content').innerHTML = html;

  wireQuiz(u);
  fcState.prefix = 'u'+u.id;
  fcState.allItems = allVocabEntries(u);
  fcState.items = shuffle(fcState.allItems);
  fcState.idx=0; fcState.flipped=false; fcState.filterUnknown=false;
  initCards();

  setupUnitScrollspy();
  if(route.scrollTo){ setTimeout(()=> scrollToStation(route.scrollTo), 60); }
}
function scrollToStation(key){
  const el = document.getElementById('station-'+key);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function setupUnitScrollspy(){
  if(unitObserver) unitObserver.disconnect();
  const chips = document.querySelectorAll('#unitRail .rail-chip');
  unitObserver = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        chips.forEach(c=>c.classList.remove('on'));
        const chip = document.querySelector(`#unitRail .rail-chip[data-target="${en.target.id}"]`);
        if(chip) chip.classList.add('on');
      }
    });
  }, {rootMargin:'-140px 0px -60% 0px'});
  document.querySelectorAll('.station').forEach(s=> unitObserver.observe(s));
}

const CAT_SHORT_LABEL = {nouns:'اسم', verbs:'فعل', adjectives:'صفة', adverbs:'ظرف', expressions:'تعبير'};
function renderVocabStation(u){
  const cats = [["nouns","أسماء (Nouns)"],["verbs","أفعال (Verbs)"],["adjectives","صفات (Adjectives)"],["adverbs","ظروف (Adverbs)"],["expressions","تعبيرات ومصطلحات (Expressions)"]];
  let html = `<p style="margin:0 0 14px; font-size:.78rem; color:var(--ink-faint);">💡 اضغط ☆ لإضافة الكلمة إلى «كلماتي الصعبة» للمراجعة السريعة لاحقًا.</p>`;
  cats.forEach(([key,label])=>{
    const items = u.vocab[key];
    if(!items || items.length===0) return;
    html += `<div class="vocab-group"><h3>${label} <span class="qtag">${items.length}</span></h3><div class="vocab-grid">`;
    items.forEach(([en,ar])=>{
      const marked = !!weakWords[en];
      const enSafe = esc(en).replace(/'/g,"\\'"), arSafe = esc(ar).replace(/'/g,"\\'");
      html += `<div class="vocab-item" data-cat="${key}"><span class="cat-pill">${CAT_SHORT_LABEL[key]}</span><span class="vw en">${esc(en)}</span><span class="va">${esc(ar)}</span><span class="item-actions"><button class="star-btn ${marked?'on':''}" onclick="toggleWeak(this,'${enSafe}','${arSafe}',${u.number})" title="أضف لمراجعة الكلمات الصعبة">${marked?'★':'☆'}</button></span></div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

function renderGrammarStation(u, extra){
  let html = u.grammarPoints.map(g=>`
    <div class="g-card">
      <h3>${esc(g.titleAr)}</h3>
      <span class="en-sub en">${esc(g.titleEn)}</span>
      <p>${esc(g.explanationAr)}</p>
      ${g.examples.map(ex=>`<div class="ex-row"><span class="en">${esc(ex.en)}</span><span class="ar">${esc(ex.ar)}</span></div>`).join('')}
    </div>`).join('');
  if(extra.mistakes && extra.mistakes.length){
    html += extra.mistakes.map(m=>`
      <div class="callout mistake"><b>⚠️ خطأ شائع</b>
        <div class="wrong-box"><span>✗</span><span class="en">${esc(m.wrong)}</span></div>
        <div class="right-box"><span>✔</span><span class="en">${esc(m.right)}</span></div>
        <p style="margin:8px 0 0; color:var(--ink-soft); font-size:.85rem;">${esc(m.note)}</p>
      </div>`).join('');
  }
  if(extra.tip){
    html += `<div class="callout tip"><b>💡 نصيحة اختبار</b><p style="margin:0; color:var(--ink-soft); font-size:.85rem;">${esc(extra.tip)}</p></div>`;
  }
  return html;
}

function renderSelfStation(u){
  const items = u.grammarPoints.map(g=> 'أستطيع استخدام: '+g.titleAr).concat(['أعرف أغلب مفردات هذه الوحدة','أستطيع حل جميع أنواع الأسئلة في اختبار هذه الوحدة']);
  const saved = selfCheck['u'+u.id] || [];
  const doneCount = saved.filter(Boolean).length;
  const pct = items.length? Math.round((doneCount/items.length)*100):0;
  const rows = items.map((label,i)=>{
    const checked = !!saved[i];
    return `<label class="self-row ${checked?'done':''}">
      <input type="checkbox" id="self-${u.id}-${i}" ${checked?'checked':''} onchange="toggleSelf(${u.id},${i},this.checked)">
      <span>${esc(label)}</span>
    </label>`;
  }).join('');
  return `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      <span style="color:var(--ink-faint); font-size:.82rem;">علّم كل نقطة تشعر أنك أتقنتها فعلاً.</span>
      <span class="score-pill"><span class="en">${doneCount} / ${items.length} · ${pct}%</span></span>
    </div>
    <div class="self-list">${rows}</div>`;
}
function toggleSelf(unitId, idx, val){
  const k='u'+unitId; if(!selfCheck[k]) selfCheck[k]=[];
  selfCheck[k][idx]=val; saveSelf();
  const section = document.getElementById('station-self');
  const u = UNITS.find(x=>x.id===unitId);
  if(section) section.querySelector('h2').parentElement.parentElement.querySelector('.station-head').nextElementSibling; // no-op guard
  if(section){
    const scoreEl = section.querySelector('.score-pill');
    const items = u.grammarPoints.length+2;
    const doneCount = (selfCheck[k]||[]).filter(Boolean).length;
    if(scoreEl) scoreEl.innerHTML = `<span class="en">${doneCount} / ${items} · ${Math.round((doneCount/items)*100)}%</span>`;
  }
}

/* ======================= QUIZ ======================= */
function renderQuizStation(u){
  const q = u.quiz;
  const total = q.mcq.length+q.tf.length+q.fill.length+q.match.length+q.translate.length+q.correct.length;
  let html = `<div id="quizRoot" data-unit="${u.id}" data-total="${total}">`;
  html += `<div class="quiz-meta">
    <div class="quiz-meta-item">📝 <span id="quizProgress">0 / ${total}</span> تمت الإجابة</div>
    <div class="quiz-meta-item">⏱ <span id="quizTimer">00:00</span></div>
  </div>`;
  html += `<div class="qsection" data-type="mcq"><h3>اختيار من متعدد <span class="qtag">Multiple Choice</span></h3>` +
    q.mcq.map((item,i)=>`
      <div class="qitem" data-idx="${i}">
        <div class="qtext">${i+1}. <span class="en">${esc(item.q)}</span></div>
        <div class="opts">${item.options.map((op,oi)=>`<button class="opt-btn" data-oi="${oi}" onclick="selectMCQ(this,${oi})"><span class="en">${esc(op)}</span></button>`).join('')}</div>
        <div class="feedback"></div>
      </div>`).join('') + `</div>`;

  html += `<div class="qsection" data-type="tf"><h3>صواب أم خطأ <span class="qtag">True / False</span></h3>` +
    q.tf.map((item,i)=>`
      <div class="qitem" data-idx="${i}">
        <div class="qtext">${i+1}. <span class="en">${esc(item.q)}</span></div>
        <div class="tf-row">
          <button class="opt-btn" data-val="true" onclick="selectTF(this,true)">✔ صواب</button>
          <button class="opt-btn" data-val="false" onclick="selectTF(this,false)">✘ خطأ</button>
        </div>
        <div class="feedback"></div>
      </div>`).join('') + `</div>`;

  html += `<div class="qsection" data-type="fill"><h3>أكمل الفراغ <span class="qtag">Fill in the Blank</span></h3>` +
    q.fill.map((item,i)=>`
      <div class="qitem" data-idx="${i}">
        <div class="qtext">${i+1}. <span class="en">${esc(item.q)}</span></div>
        <div class="opts">${item.bank.map(op=>`<button class="opt-btn" onclick="selectFill(this,'${esc(op).replace(/'/g,"\\'")}')"><span class="en">${esc(op)}</span></button>`).join('')}</div>
        <div class="feedback"></div>
      </div>`).join('') + `</div>`;

  html += `<div class="qsection" data-type="match"><h3>وصّل الكلمة بمعناها <span class="qtag">Matching</span></h3><div class="qitem">` +
    q.match.map((pair,i)=>{
      const opts = shuffle(q.match.map(p=>p[1]));
      return `<div class="match-row" data-idx="${i}" data-answer="${esc(pair[1])}">
        <span class="vw en">${i+1}. ${esc(pair[0])}</span>
        <select onchange="checkMatchLive(this)">
          <option value="">اختر المعنى...</option>
          ${opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
        </select>
        <span class="feedback"></span>
      </div>`;
    }).join('') + `</div></div>`;

  html += `<div class="qsection" data-type="translate"><h3>ترجم إلى الإنجليزية <span class="qtag">Translation</span></h3>` +
    q.translate.map((pair,i)=>`
      <div class="qitem" data-idx="${i}" data-answer="${esc(pair[1])}" data-ar="${esc(pair[0])}">
        <div class="qtext">${i+1}. ${esc(pair[0])}</div>
        <input type="text" class="en" placeholder="type the English word…" oninput="updateQuizProgress()" />
        <div class="feedback"></div>
      </div>`).join('') + `</div>`;

  html += `<div class="qsection" data-type="correct"><h3>صحّح الخطأ <span class="qtag">Error Correction</span></h3>` +
    q.correct.map((item,i)=>`
      <div class="qitem" data-idx="${i}" data-answer="${esc(item.right)}">
        <div class="qtext">${i+1}. <span class="en" style="color:var(--error)">✗ ${esc(item.wrong)}</span></div>
        <input type="text" class="en" placeholder="rewrite the sentence correctly…" oninput="updateQuizProgress()" />
        <div class="feedback"></div>
      </div>`).join('') + `</div>`;

  html += `<div class="quiz-actions">
    <button class="btn" onclick="checkAllQuiz(${u.id})">✅ تحقق من إجاباتي</button>
    <button class="btn secondary" onclick="resetQuiz(${u.id})">↺ إعادة المحاولة</button>
    <span class="score-pill" id="scorePill">لم تُحلّ بعد</span>
  </div>`;
  html += `</div>`;
  return html;
}
function selectMCQ(btn, oi){
  const item = btn.closest('.qitem');
  item.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected'); item.dataset.selected = oi; updateQuizProgress();
}
function selectTF(btn, val){
  const item = btn.closest('.qitem');
  item.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected'); item.dataset.selected = val; updateQuizProgress();
}
function selectFill(btn, val){
  const item = btn.closest('.qitem');
  item.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected'); item.dataset.selected = val; updateQuizProgress();
}
function checkMatchLive(sel){ updateQuizProgress(); }
let quizTimerHandle=null, quizTimerSecs=0;
function updateQuizProgress(){
  const root = document.getElementById('quizRoot'); if(!root) return;
  const total = parseInt(root.dataset.total)||0; let answered=0;
  root.querySelectorAll('.qsection[data-type="mcq"] .qitem, .qsection[data-type="tf"] .qitem, .qsection[data-type="fill"] .qitem').forEach(item=>{
    if(item.dataset.selected!==undefined && item.dataset.selected!=='') answered++;
  });
  root.querySelectorAll('.qsection[data-type="match"] .match-row select').forEach(sel=>{ if(sel.value) answered++; });
  root.querySelectorAll('.qsection[data-type="translate"] input, .qsection[data-type="correct"] input').forEach(inp=>{ if(inp.value.trim()) answered++; });
  const pEl = document.getElementById('quizProgress'); if(pEl) pEl.textContent = `${answered} / ${total}`;
}
function startQuizTimer(){
  quizTimerSecs=0; if(quizTimerHandle) clearInterval(quizTimerHandle);
  const tEl = document.getElementById('quizTimer'); if(!tEl) return;
  quizTimerHandle = setInterval(()=>{
    quizTimerSecs++;
    const m=String(Math.floor(quizTimerSecs/60)).padStart(2,'0'), s=String(quizTimerSecs%60).padStart(2,'0');
    const el=document.getElementById('quizTimer'); if(el) el.textContent=`${m}:${s}`; else clearInterval(quizTimerHandle);
  },1000);
}
function wireQuiz(u){ updateQuizProgress(); startQuizTimer(); }
function checkAllQuiz(unitId){
  const u = UNITS.find(x=>x.id===unitId);
  const root = document.getElementById('quizRoot');
  let correctCount=0, total=0;

  root.querySelectorAll('.qsection[data-type="mcq"] .qitem').forEach((item,i)=>{
    total++; const ans=u.quiz.mcq[i].answer, sel=item.dataset.selected, fb=item.querySelector('.feedback');
    item.querySelectorAll('.opt-btn').forEach((b,oi)=>{ if(oi===ans) b.classList.add('correct'); else if(String(oi)===String(sel)) b.classList.add('wrong'); });
    if(sel!==undefined && parseInt(sel)===ans){ correctCount++; fb.textContent='✔ صحيح'; fb.className='feedback ok'; }
    else { fb.textContent='✘ الإجابة الصحيحة: '+u.quiz.mcq[i].options[ans]; fb.className='feedback bad'; }
  });
  root.querySelectorAll('.qsection[data-type="tf"] .qitem').forEach((item,i)=>{
    total++; const ans=u.quiz.tf[i].answer, sel=item.dataset.selected, fb=item.querySelector('.feedback');
    item.querySelectorAll('.opt-btn').forEach(b=>{ const bv=b.dataset.val==='true'; if(bv===ans) b.classList.add('correct'); else if(sel!==undefined && (sel==='true')===bv) b.classList.add('wrong'); });
    if(sel!==undefined && (sel==='true')===ans){ correctCount++; fb.textContent='✔ صحيح'; fb.className='feedback ok'; }
    else { fb.textContent='✘ الإجابة الصحيحة: '+(ans?'صواب':'خطأ'); fb.className='feedback bad'; }
  });
  root.querySelectorAll('.qsection[data-type="fill"] .qitem').forEach((item,i)=>{
    total++; const ans=u.quiz.fill[i].answer, sel=item.dataset.selected, fb=item.querySelector('.feedback');
    item.querySelectorAll('.opt-btn').forEach(b=>{ const txt=b.textContent.trim(); if(txt===ans) b.classList.add('correct'); else if(sel===txt) b.classList.add('wrong'); });
    if(sel===ans){ correctCount++; fb.textContent='✔ صحيح'; fb.className='feedback ok'; }
    else { fb.textContent='✘ الإجابة الصحيحة: '+ans; fb.className='feedback bad'; }
  });
  root.querySelectorAll('.qsection[data-type="match"] .match-row').forEach(row=>{
    total++; const ans=row.dataset.answer, sel=row.querySelector('select'), fb=row.querySelector('.feedback');
    const enWord = row.querySelector('.vw')?row.querySelector('.vw').textContent.replace(/^\d+\.\s*/,''):'';
    if(sel.value===ans){ correctCount++; fb.textContent='✔'; fb.className='feedback ok'; sel.style.borderColor='var(--success)'; unmarkWeak(enWord); }
    else { fb.textContent='✘ الصحيح: '+ans; fb.className='feedback bad'; sel.style.borderColor='var(--error)'; markWeak(enWord, ans, u.number); }
  });
  root.querySelectorAll('.qsection[data-type="translate"] .qitem').forEach(item=>{
    total++; const ans=item.dataset.answer, arWord=item.dataset.ar||'', input=item.querySelector('input'), fb=item.querySelector('.feedback');
    if(normalize(input.value)===normalize(ans)){ correctCount++; fb.textContent='✔ صحيح'; fb.className='feedback ok'; input.style.borderColor='var(--success)'; unmarkWeak(ans); }
    else { fb.textContent='✘ الإجابة الصحيحة: '+ans; fb.className='feedback bad'; input.style.borderColor='var(--error)'; markWeak(ans, arWord, u.number); }
  });
  root.querySelectorAll('.qsection[data-type="correct"] .qitem').forEach(item=>{
    total++; const ans=item.dataset.answer, input=item.querySelector('input'), fb=item.querySelector('.feedback');
    if(normalize(input.value)===normalize(ans)){ correctCount++; fb.textContent='✔ صحيح'; fb.className='feedback ok'; input.style.borderColor='var(--success)'; }
    else { fb.textContent='✘ الصيغة الصحيحة: '+ans; fb.className='feedback bad'; input.style.borderColor='var(--error)'; }
  });

  document.getElementById('scorePill').innerHTML = `النتيجة: <span class="en">${correctCount} / ${total}</span>`;
  progress['u'+unitId] = {score:correctCount, total:total, date:Date.now()};
  saveProgress();
  updateQuizProgress();
  if(quizTimerHandle){ clearInterval(quizTimerHandle); quizTimerHandle=null; }
  if(total>0 && correctCount===total){ fireConfetti(); showToast('🎉 نتيجة كاملة! أحسنت'); }
}
function resetQuiz(unitId){ goTo('/unit/'+unitId+'/quiz'); setTimeout(render,0); }

let fcState = {items:[], allItems:[], idx:0, flipped:false, prefix:'u', filterUnknown:false};
function fcKey(c){ return fcState.prefix+'_'+c.en; }
function fcMarkupFor(u){
  return `<div class="fc-wrap">
    <div class="fc-toolbar"><label class="fc-filter"><input type="checkbox" id="fcFilterChk" onchange="toggleFcFilter(this.checked)"> أظهر فقط الكلمات التي لم أتقنها بعد</label></div>
    <div class="fc-counter" id="fcCounter"></div>
    <div class="flashcard" id="fcCard" onclick="flipCard()"></div>
    <div class="fc-know-row" id="fcKnowRow" style="display:none;">
      <button class="btn secondary" onclick="markCardUnknown()">🔁 أحتاج مراجعة</button>
      <button class="btn" onclick="markCardKnown()">✔ أعرفها</button>
    </div>
    <div class="fc-controls">
      <button class="btn secondary" onclick="prevCard()">◀ السابق</button>
      <button class="btn secondary" onclick="shuffleCards()">🔀 عشوائي</button>
      <button class="btn" onclick="nextCard()">التالي ▶</button>
    </div>
    <p style="color:var(--ink-faint); font-size:.72rem; margin:0; text-align:center;">اختصارات: مسافة = تقليب · ← → للتنقل · K = أعرفها</p>
  </div>`;
}
function renderWeakCardsMarkup(){
  fcState.prefix = 'weak';
  fcState.allItems = Object.values(weakWords).map(w=>({en:w.en, ar:w.ar, cat:'weak'}));
  fcState.items = shuffle(fcState.allItems);
  fcState.idx=0; fcState.flipped=false; fcState.filterUnknown=false;
  if(fcState.items.length===0){
    return `<div class="card" style="text-align:center; padding:40px 20px;">
      <p style="font-size:2rem; margin:0 0 8px;">🎉</p>
      <p style="margin:0; color:var(--ink-soft);">لا توجد كلمات صعبة محفوظة الآن! أضف كلمات بالضغط على ☆ في أي قائمة مفردات، أو ستُضاف تلقائيًا عند الخطأ فيها بالاختبارات.</p>
      <button class="btn secondary" style="margin-top:14px;" onclick="goTo('/glossary')">📖 تصفح القاموس الشامل</button>
    </div>`;
  }
  return `<div class="card">${fcMarkupFor(null)}</div>`;
}
function initCards(){ paintCard(); document.addEventListener('keydown', fcKeyHandler); }
function fcKeyHandler(e){
  if(!document.getElementById('fcCard')){ document.removeEventListener('keydown', fcKeyHandler); return; }
  if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='SELECT' || e.target.tagName==='TEXTAREA')) return;
  if(e.code==='Space'){ e.preventDefault(); flipCard(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prevCard(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); nextCard(); }
  else if(e.key==='k' || e.key==='K'){ e.preventDefault(); markCardKnown(); }
}
function toggleFcFilter(val){
  fcState.filterUnknown = val;
  fcState.items = shuffle(val ? fcState.allItems.filter(c=>!isKnown(fcKey(c))) : fcState.allItems);
  fcState.idx=0; fcState.flipped=false; paintCard();
}
function paintCard(){
  const el=document.getElementById('fcCard'), counter=document.getElementById('fcCounter'), knowRow=document.getElementById('fcKnowRow');
  if(!el) return;
  if(fcState.items.length===0){ if(counter) counter.textContent='لا توجد بطاقات مطابقة للفلتر الحالي'; el.innerHTML=''; if(knowRow) knowRow.style.display='none'; return; }
  const c = fcState.items[fcState.idx]; const knownFlag = isKnown(fcKey(c));
  if(counter) counter.textContent = `بطاقة ${fcState.idx+1} من ${fcState.items.length} — اضغط للتقليب`;
  const knownTag = knownFlag?'<span class="fc-known-tag">✔ معروفة</span>':'';
  if(fcState.flipped){ el.innerHTML = `${knownTag}<span class="fc-face-ar">${esc(c.ar)}</span><span class="fc-hint">${esc(c.en)}</span>`; }
  else {
    el.innerHTML = `${knownTag}<span class="fc-face-en en">${esc(c.en)}</span><span class="fc-hint">اضغط لرؤية المعنى</span>`;
  }
  if(knowRow) knowRow.style.display='flex';
}
function flipCard(){ if(fcState.items.length===0) return; fcState.flipped=!fcState.flipped; paintCard(); }
function nextCard(){ if(fcState.items.length===0) return; fcState.idx=(fcState.idx+1)%fcState.items.length; fcState.flipped=false; paintCard(); }
function prevCard(){ if(fcState.items.length===0) return; fcState.idx=(fcState.idx-1+fcState.items.length)%fcState.items.length; fcState.flipped=false; paintCard(); }
function shuffleCards(){ fcState.items = shuffle(fcState.items); fcState.idx=0; fcState.flipped=false; paintCard(); }
function markCardKnown(){ if(fcState.items.length===0) return; const c=fcState.items[fcState.idx]; known[fcKey(c)]=true; saveKnown(); nextCard(); }
function markCardUnknown(){ if(fcState.items.length===0) return; const c=fcState.items[fcState.idx]; delete known[fcKey(c)]; saveKnown(); nextCard(); }

/* ======================= EXPANSION ======================= */
function renderExpansion(route){
  const e = EXPANSIONS.find(x=>x.id===route.id);
  if(!e){ goTo('/'); return; }
  let html = `<div class="page-header">
    <p class="eyebrow">EXPANSION &middot; صفحات الكتاب <span class="en">${esc(e.pages)}</span></p>
    <h1>🔁 ${esc(e.titleAr)}<span class="en" style="font-size:1rem; color:var(--ink-faint);">${esc(e.titleEn)}</span></h1>
  </div>
  <div class="card" style="margin-bottom:16px;"><p style="margin:0; color:var(--ink-soft);">${esc(e.note)}</p></div>
  <div class="card stack">`;
  const cats = [["nouns","أسماء"],["verbs","أفعال"],["adjectives","صفات"],["adverbs","ظروف"],["expressions","تعبيرات"]];
  cats.forEach(([key,label])=>{
    const items = e.vocab[key];
    if(!items || items.length===0) return;
    html += `<div class="vocab-group"><h3>${label} <span class="qtag">${items.length}</span></h3><div class="vocab-grid">`;
    items.forEach(([en,ar])=>{ html += `<div class="vocab-item"><span class="vw en">${esc(en)}</span><span class="va">${esc(ar)}</span></div>`; });
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

/* ======================= FINAL REVIEW ======================= */
let finalSet = [];
function buildFinalSet(){
  let pool=[];
  UNITS.forEach(u=>{
    u.quiz.mcq.forEach(it=> pool.push({type:'mcq', unit:u.number, ...it}));
    u.quiz.tf.forEach(it=> pool.push({type:'tf', unit:u.number, ...it}));
    u.quiz.fill.forEach(it=> pool.push({type:'fill', unit:u.number, ...it}));
  });
  finalSet = shuffle(pool).slice(0,40);
}
function questionMarkup(item,i){
  if(item.type==='mcq'){
    return `<div class="qitem" data-type="mcq" data-idx="${i}" data-answer="${item.answer}">
      <div class="qtext">${i+1}. <span class="qtag">U${item.unit}</span> <span class="en">${esc(item.q)}</span></div>
      <div class="opts">${item.options.map((op,oi)=>`<button class="opt-btn" onclick="selectMCQ(this,${oi})"><span class="en">${esc(op)}</span></button>`).join('')}</div>
      <div class="feedback"></div></div>`;
  } else if(item.type==='tf'){
    return `<div class="qitem" data-type="tf" data-idx="${i}" data-answer="${item.answer}">
      <div class="qtext">${i+1}. <span class="qtag">U${item.unit}</span> <span class="en">${esc(item.q)}</span></div>
      <div class="tf-row"><button class="opt-btn" data-val="true" onclick="selectTF(this,true)">✔ صواب</button><button class="opt-btn" data-val="false" onclick="selectTF(this,false)">✘ خطأ</button></div>
      <div class="feedback"></div></div>`;
  } else {
    return `<div class="qitem" data-type="fill" data-idx="${i}" data-answer="${esc(item.answer)}">
      <div class="qtext">${i+1}. <span class="qtag">U${item.unit}</span> <span class="en">${esc(item.q)}</span></div>
      <div class="opts">${item.bank.map(op=>`<button class="opt-btn" onclick="selectFill(this,'${esc(op).replace(/'/g,"\\'")}')"><span class="en">${esc(op)}</span></button>`).join('')}</div>
      <div class="feedback"></div></div>`;
  }
}
function renderFinal(){
  buildFinalSet();
  let html = finalSet.map((item,i)=> questionMarkup(item,i)).join('');
  document.getElementById('content').innerHTML = `
    <div class="page-header">
      <p class="eyebrow">FINAL REVIEW · 40 سؤال عشوائي من كل الوحدات</p>
      <h1>🏁 اختبار شامل نهائي<span class="en" style="font-size:1rem; color:var(--ink-faint);">Final Mixed Review</span></h1>
      <div class="chips"><span class="chip">مزيج من اختيار متعدد وصواب/خطأ وإكمال — مثالي كمراجعة أخيرة قبل الاختبار</span></div>
    </div>
    <div id="finalRoot" class="stack">${html}</div>
    <div class="quiz-actions">
      <button class="btn" onclick="checkFinal()">✅ تحقق من إجاباتي</button>
      <button class="btn secondary" onclick="goTo('/final'); setTimeout(render,0);">🔀 مجموعة أسئلة جديدة</button>
      <span class="score-pill" id="finalScorePill">لم تُحلّ بعد</span>
    </div>`;
}
function gradeGenericSet(root, scorePillId, onDone){
  let correct=0, total=0;
  root.querySelectorAll('.qitem').forEach(item=>{
    total++; const type=item.dataset.type, fb=item.querySelector('.feedback');
    if(type==='mcq'){
      const ans=parseInt(item.dataset.answer), sel=item.dataset.selected;
      item.querySelectorAll('.opt-btn').forEach((b,oi)=>{ if(oi===ans) b.classList.add('correct'); else if(String(oi)===String(sel)) b.classList.add('wrong'); });
      if(sel!==undefined && parseInt(sel)===ans){ correct++; fb.textContent='✔'; fb.className='feedback ok'; } else { fb.textContent='✘'; fb.className='feedback bad'; }
    } else if(type==='tf'){
      const ans=item.dataset.answer==='true', sel=item.dataset.selected;
      item.querySelectorAll('.opt-btn').forEach(b=>{ const bv=b.dataset.val==='true'; if(bv===ans) b.classList.add('correct'); else if(sel!==undefined && (sel==='true')===bv) b.classList.add('wrong'); });
      if(sel!==undefined && (sel==='true')===ans){ correct++; fb.textContent='✔'; fb.className='feedback ok'; } else { fb.textContent='✘'; fb.className='feedback bad'; }
    } else {
      const ans=item.dataset.answer, sel=item.dataset.selected;
      item.querySelectorAll('.opt-btn').forEach(b=>{ const txt=b.textContent.trim(); if(txt===ans) b.classList.add('correct'); else if(sel===txt) b.classList.add('wrong'); });
      if(sel===ans){ correct++; fb.textContent='✔'; fb.className='feedback ok'; } else { fb.textContent='✘ الصحيح: '+ans; fb.className='feedback bad'; }
    }
  });
  document.getElementById(scorePillId).innerHTML = `النتيجة: <span class="en">${correct} / ${total}</span>`;
  if(onDone) onDone(correct,total);
  return {correct,total};
}
function checkFinal(){
  const root = document.getElementById('finalRoot');
  const {correct,total} = gradeGenericSet(root, 'finalScorePill');
  if(total>0 && correct/total>=0.9){ fireConfetti(); showToast('🏆 أداء رائع في المراجعة الشاملة!'); }
}

/* ======================= DAILY CHALLENGE ======================= */
function buildDailySet(){
  let pool=[];
  UNITS.forEach(u=>{
    u.quiz.mcq.forEach(it=> pool.push({type:'mcq', unit:u.number, ...it}));
    u.quiz.tf.forEach(it=> pool.push({type:'tf', unit:u.number, ...it}));
    u.quiz.fill.forEach(it=> pool.push({type:'fill', unit:u.number, ...it}));
  });
  const rnd = seededRand('sg2v2-daily-'+todayStr());
  return seededShuffle(pool, rnd).slice(0,10);
}
function renderDaily(){
  const daily = loadJSON(LS_DAILY, {});
  const streak = loadJSON(LS_STREAK, {count:0});
  const already = daily.date===todayStr();
  let html = `<div class="page-header">
    <p class="eyebrow">DAILY CHALLENGE</p>
    <h1>🔥 تحدي اليوم<span class="en" style="font-size:1rem; color:var(--ink-faint);">10 Random Questions</span></h1>
    <div class="chips"><span class="chip gold"><span class="en">🔥 ${streak.count||0}</span> يوم متتالي</span><span class="chip">أسئلة جديدة كل يوم من كل الوحدات</span></div>
  </div>`;
  if(already){
    html += `<div class="card" style="text-align:center; padding:34px 20px;">
      <p style="font-size:2rem; margin:0 0 10px;">${daily.score/daily.total>=0.8?'🌟':'✅'}</p>
      <h3 style="margin-bottom:8px;">أنجزت تحدي اليوم بنتيجة <span class="en">${daily.score} / ${daily.total}</span></h3>
      <p style="color:var(--ink-soft); font-size:.85rem; margin-bottom:18px;">عد غدًا لتحدٍ جديد بأسئلة مختلفة، أو تدرّب الآن بدون تأثير على السجل.</p>
      <button class="btn secondary" onclick="renderDailyPractice()">🔁 تدرّب الآن (بدون تسجيل)</button>
    </div>
    <div id="dailyPracticeArea"></div>`;
    document.getElementById('content').innerHTML = html;
    return;
  }
  const set = buildDailySet();
  html += `<div id="dailyRoot" class="stack">${set.map((item,i)=>questionMarkup(item,i)).join('')}</div>
    <div class="quiz-actions">
      <button class="btn" onclick="checkDaily()">✅ سلّم التحدي</button>
      <span class="score-pill" id="dailyScorePill">لم تُحلّ بعد</span>
    </div>`;
  document.getElementById('content').innerHTML = html;
}
function renderDailyPractice(){
  const set = buildDailySet();
  const area = document.getElementById('dailyPracticeArea');
  area.innerHTML = `<div class="card stack" style="margin-top:16px;">
    <div id="dailyPracticeRoot" class="stack">${set.map((item,i)=>questionMarkup(item,i)).join('')}</div>
    <div class="quiz-actions"><button class="btn" onclick="gradeGenericSet(document.getElementById('dailyPracticeRoot'),'dailyPracticeScore')">✅ تحقق</button><span class="score-pill" id="dailyPracticeScore">لم تُحلّ بعد</span></div>
  </div>`;
}
function checkDaily(){
  const root = document.getElementById('dailyRoot');
  const {correct,total} = gradeGenericSet(root, 'dailyScorePill');
  const today = todayStr();
  saveJSON(LS_DAILY, {date:today, score:correct, total});
  let streak = loadJSON(LS_STREAK, {count:0, last:null});
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(streak.last===today){ /* already counted */ }
  else if(streak.last===yStr){ streak.count = (streak.count||0)+1; streak.last = today; }
  else { streak.count = 1; streak.last = today; }
  saveJSON(LS_STREAK, streak);
  if(total>0 && correct/total>=0.8){ fireConfetti(); showToast('🔥 أحسنت! تم تحديث سلسلتك اليومية'); }
  setTimeout(renderDaily, 900);
}

function removeWeakRow(en){ unmarkWeak(en); renderWeak(); }

/* ======================= GLOSSARY ======================= */
let glossaryFilter = {unit:'', q:''};
function renderGlossary(){
  glossaryFilter = {unit:'', q:''};
  document.getElementById('content').innerHTML = `
    <div class="page-header">
      <p class="eyebrow">REFERENCE</p>
      <h1>📖 القاموس الشامل<span class="en" style="font-size:1rem; color:var(--ink-faint);">Full Glossary</span></h1>
      <div class="chips"><span class="chip">${allGlossaryEntries().length}+ كلمة من جميع وحدات الفصل</span></div>
    </div>
    <div class="glossary-controls">
      <input type="text" id="glosSearch" placeholder="ابحث عن كلمة بالإنجليزية أو العربية…" oninput="filterGlossary()">
      <select id="glosUnit" onchange="filterGlossary()">
        <option value="">كل الوحدات</option>
        ${UNITS.map(u=>`<option value="${u.number}">الوحدة ${u.number} — ${esc(u.titleAr)}</option>`).join('')}
      </select>
    </div>
    <div class="card"><div class="vocab-grid" id="glosGrid"></div></div>`;
  paintGlossary();
}
function allGlossaryEntries(){ let out=[]; UNITS.forEach(u=>{ allVocabEntries(u).forEach(e=> out.push({...e, unit:u.number})); }); return out; }
function filterGlossary(){
  glossaryFilter.q = (document.getElementById('glosSearch')||{}).value || '';
  glossaryFilter.unit = (document.getElementById('glosUnit')||{}).value || '';
  paintGlossary();
}
function paintGlossary(){
  const all = allGlossaryEntries(); const q = normalize(glossaryFilter.q);
  const filtered = all.filter(e=>{
    if(glossaryFilter.unit && String(e.unit)!==String(glossaryFilter.unit)) return false;
    if(q && !normalize(e.en).includes(q) && !e.ar.includes(glossaryFilter.q.trim())) return false;
    return true;
  });
  const grid = document.getElementById('glosGrid'); if(!grid) return;
  if(filtered.length===0){ grid.innerHTML = `<p style="color:var(--ink-faint);">لا نتائج مطابقة.</p>`; return; }
  const marked = w=>!!weakWords[w];
  grid.innerHTML = filtered.map(e=>{
    const enSafe=esc(e.en).replace(/'/g,"\\'"), arSafe=esc(e.ar).replace(/'/g,"\\'");
    return `<div class="vocab-item"><span class="vw en">${esc(e.en)}</span><span class="va">${esc(e.ar)} <span class="wtag">U${e.unit}</span></span><span class="item-actions"><button class="star-btn ${marked(e.en)?'on':''}" onclick="toggleWeak(this,'${enSafe}','${arSafe}',${e.unit}); paintGlossary();">${marked(e.en)?'★':'☆'}</button></span></div>`;
  }).join('');
}

/* ======================= PRINT ALL ======================= */
function printAllUnits(){
  let html = `<h1 style="text-align:center;">مذكرة SuperGoal 2 — الفصل الأول كاملاً</h1>`;

    html += `<div class="p-unit"><h2>وحدة ${u.number}: ${esc(u.titleAr)} <span class="en">(${esc(u.titleEn)})</span></h2>`;

    u.grammarPoints.forEach(g=>{
      html += `<p><b>${esc(g.titleAr)} (${esc(g.titleEn)})</b><br>${esc(g.explanationAr)}</p>`;
      g.examples.forEach(ex=> html += `<div>• <span class="en">${esc(ex.en)}</span> — ${esc(ex.ar)}</div>`);
    });
    html += `</div>`;
  });
  document.getElementById('printAllRoot').innerHTML = html;
  document.body.classList.add('printing-all');
  setTimeout(()=>{ window.print(); setTimeout(()=> document.body.classList.remove('printing-all'), 500); }, 200);

/* ======================= MAIN RENDER ======================= */
function render(){
  const route = parseHash();
  if(route.view==='home') renderHome();
  else if(route.view==='unit') renderUnit(route);
  else if(route.view==='expansion') renderExpansion(route);
  else if(route.view==='irregular') renderIrregular();
  else if(route.view==='final') renderFinal();
  else if(route.view==='daily') renderDaily();
  else if(route.view==='weak') renderWeak();
  else if(route.view==='glossary') renderGlossary();
  else if(route.view==='weakcards'){
    document.getElementById('content').innerHTML = `
      <div class="page-header">
        <p class="eyebrow">SMART REVIEW</p>
        <h1>🃏 بطاقات الكلمات الصعبة<span class="en" style="font-size:1rem; color:var(--ink-faint);">Weak Words Flashcards</span></h1>
      </div>
      ${renderWeakCardsMarkup()}`;
    initCards();
  }
  document.querySelectorAll('.nav-chip').forEach(c=> c.classList.toggle('active', c.dataset.route === ('/'+(route.view==='home'?'':route.view))));
  window.scrollTo(0,0);
  try{ localStorage.setItem(LS_LASTROUTE, location.hash || '#/'); }catch(e){}
}
window.addEventListener('hashchange', render);
(function boot(){
  const hasHash = !!(location.hash && location.hash.length>1);
  let lastRoute = null;
  try{ lastRoute = localStorage.getItem(LS_LASTROUTE); }catch(e){}
  if(!hasHash && lastRoute && lastRoute!=='#/' && lastRoute!=='#'){
    location.hash = lastRoute;
    setTimeout(()=> showToast('⏪ رجعناك لمكان توقفك آخر مرة'), 350);
  } else {
    render();
  }
})();

if(window.claude?.hot){ window.claude.hot.snapshot?.(()=>({})); }
